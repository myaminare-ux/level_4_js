<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>클래스 활용 + 조건문 2</title>
    <link rel="stylesheet" href="./styles/reset.css">
    <script src="./scripts/class_if2.js" defer></script>
    <style>
        /* 내부 스타일 */
        p {background-color:#ff0;}
        em {font-weight:800; color: #ff0;}
        #btn1 {border:1px solid #222; padding:10px;}
        /* 자바스크립트 제어목적 클래스 */
        .error {background:#f00; color:#fff;} /* 실제 태그가 아니라 js에서 부르기 위해 만든 임의의 css */
    </style>
</head>
<body>
    <p>안내문구</p>
    <input type="text" name="user_id" id="user_id" placeholder="아이디를 입력하세요.">
    <button type="button" id="btn1">클래스 제어</button>
</body>
</html>
