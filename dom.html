<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 요소 다양한 제어 방법</title>
    <link rel="stylesheet" href="./styles/reset.css">
    <script src="./scripts/dom.js" defer></script>
    <style>
        /* 내부 스타일 */
        /* 1. 바로구매 툴팁 data 활용 */
        .cart_buy a:nth-child(2) {
            position:relative;
            background-color:#f5f5f5;
        }
        .cart_buy a:nth-child(2)::after {
            content:attr(data-tooltip);/* 의미적인 내용은 HTML에, CSS는 attr()로 불러오기 */
            position:absolute;
            left:50%; bottom:-25px;
            padding:4px 6px;
            transform:translateX(-50%);
            background-color:#111; color:#fff;
            width:max-content;
            /* 초기 숨기기 -> opacity VS dispaly */
            display:none;
        }
        .cart_buy a:nth-child(2):hover::after {
            display:block;
        }
    </style>
</head>
<body>
    <button type="button" id="btn1">Click!</button>
    <h1>DOM data-* 속성 활용</h1>
    <section>
        <!-- 1. -->
        <div class="cart_buy" data-name="btn_group">
            <a href="#">장바구니</a>
            <a href="#" data-tooltip="로그인하셔야 가능합니다.">바로구매</a>
            <!-- 바로구매에 마우스를 올렸을 때 툴팁(로그인에 말풍선으로 나오는 그거)으로 '로그인하셔야 가능합니다.' 실행 -->
        </div>
        <!-- 2. -->
        <div class="count">
            <button type="button" id="minus">-</button>
            <span class="count_num" data-count="1"></span>
            <!-- span 안에 있는 1은 그냥 눈에 보이는 거, data-cound 안에 있는 1은 js에 보낼 수 있는 데이터 -->
            <button type="button" id="plus">+</button>
        </div>
    </section>
</body>
</html>
