<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반얀트리</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
    <style>
        /* reset */
        * {box-sizing: border-box; margin: 0; padding: 0;}
        a {text-decoration: none; color: #fff;}
        /* css design */
        body {background:#222;}
        header, main, footer {min-width:320px; max-width:760px; margin:0 auto;}
        header {position:fixed; left:50%; top:0; z-index:999; width:100%; height:60px;transform:translateX(-50%);}
        main {padding-top:60px;}
        main .bg {background:#222; height:100vh;display:flex; justify-content: center; align-items: center;}
        main .bg .card {
            background-size:cover; background-position:center;
            width:90%; height:90%;
            display:flex; justify-content: center; align-items: center;
        }
        main .bg .card h1 {
            font-size:1.2rem;
            letter-spacing: -0.02rem; text-align: center;
            text-shadow:0 0 10px rgba(255,255,255,1);
        }
        main .intro .card {background-image: url(./images/bg1.jpg);}
        main .hotel .card {background-image: url(./images/bg2.jpg); border-top-right-radius: 20px; border-bottom-right-radius: 20px;}
        main .hotel h1 {color:#eee; text-align: right; padding-right:20px; line-height:1.5; font-weight:400;}
        main .service .card {background-image: url(./images/bg3.jpg);}
        main .busan .card {background-image: url(./images/bg4.jpg);}
        footer {background:#111;}
        footer p {font-size:0.87rem; padding:30px 0; text-align: center; color:#aaa;}
        /* javascript active class or id + animation */
        main .hotel .card {opacity:0;} /* to 시작값 */
        main .hotel h1 {opacity:0; transform:translateX(-200%);}
    </style>
</head>
<body>
    <header style="background:#222; display:flex; flex-flow:row nowrap; justify-content:space-between; align-items:center; padding:10px 20px;">
        <h1 style="height:100%; filter:invert(1);"><img src="./images/logo.png" alt="반얀트리" style="height: 100%;"></h1>
        <nav style="display:flex; flex-flow:row nowrap; gap:20px; font-size: 0.87rem;">
            <a href="#">Hotel</a>
            <a href="#">Reservation</a>
            <a href="#">Gallery</a>
        </nav>
    </header>
    <main>
        <div class="intro bg">
            <div class="card"><h1>그랜드 조선 부산 호텔</h1></div>
        </div>
        <div class="hotel bg">
            <div class="card"></div>
            <h1>Grand Josun<br>Busan Hotel</h1>
        </div>
        <div class="service bg">
            <div class="card"><h1>편안한 객실<br>최상의 서비스</h1></div>
        </div>
        <div class="busan bg">
            <div class="card"><h1>최고의 휴가를<br>그랜드 조선 부산호텔과 함께 하세요</h1></div>
        </div>
    </main>
    <footer>
        <p>@현재 웹 사이트는 웹공부용으로 상업적으로 사용하지 않습니다.</p>
    </footer>
    <script>

        // 스크롤 트리거
        // ScrollTrigger 플러그인 등록
        gsap.registerPlugin(ScrollTrigger);

        // 스크롤 트리거 애니메이션 작성 위치
        // gsap.to('애니메이션 적용 대상')
        // ScrollTrigger:'애니메이션 적용대상의 근접한 부모 트리거',
        // 뜻) 부모 트리거가 화면에서 보일 때 적용 대상에 애니메이션 적용
        gsap.to('main .hotel .card',{
            opacity:1,
            duration:2,
            // scrollTrigger:'main .hotel', // 스크롤 쓸 때는 소문자 쓰기
            // 위 명령의 단점) 화면에서 1px만 보여도 바로 시작해버림
            scrollTrigger:{
                trigger:'main .hotel',
                start:'top 80%',
                scrub:true, // 스크롤 동작에 따라 실시간으로 애니메이션을 재생(스크롤 이동 방향에 따라 나타나거나 사라짐 또는 멈추기 가능) -> duration 필요 없음
                // markers:true, // 가이드 선 표시
            },
        })
        gsap.to('main .hotel h1', {
            opacity:1,
            x:0,
            duration:1.5,
            scrollTrigger:{
                trigger:'main .hotel', // 디자인 위치에 따라 트리거는 부모가 될 수 있고, 형제나 자기 자신이 될 수도 있음 == 트리거 요소(부모, 형제, 자신)이 보일 때 위의 애니메이션을 적용/작동
                // trigger:'main .hotel .card', == 형제 기준
                // trigger:'main .hotel h1', == 본인 기준
                start:'top 100%',
                // scrub:true,
            },
        })

        // 웹브라우저 스크롤 복원 기능 리셋하고 위에서 시작하기
        if ('scrollRestoration' in history) { history.scrollRestoration = 'manual';}
        window.addEventListener('load', () => { window.scrollTo(0, 0); });

    </script>
</body>
</html>
